<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Club Explorer - Playa Paraíso</title>
  
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.0.1/mapbox-gl.css" rel="stylesheet">
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.0.1/mapbox-gl.js"></script>

  <script src="js/datos-complejo.js"></script>
  <script src="js/guia-playa-paraiso.js"></script>

  <style>
    :root {
      --font-display: "Adobe Garamond Pro", Georgia, serif;
      --font-body: Arial, Helvetica, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: var(--font-display);
      background: #000000;
    }

    #map {
      width: 100vw;
      height: 100vh;
      position: absolute;
      inset: 0;
      background: #000000;
    }

    .mapboxgl-canvas,
    .mapboxgl-map {
      background: #000000 !important;
    }

    .demo-info-card {
      position: absolute;
      top: 18px;
      left: 18px;
      z-index: 100000;
      background: #ffffff;
      color: #1e293b;
      padding: 14px 18px;
      border-radius: 8px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.25);
      max-width: 290px;
      line-height: 1.35;
      font-family: var(--font-body);
    }
    .demo-info-card h2 {
      font-family: var(--font-display);
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 4px;
      color: #0f172a;
    }
    .demo-info-card p {
      font-size: 11px;
      color: #475569;
    }

    .mapboxgl-marker { z-index: 99999 !important; }
    .gp-marker-container { width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; cursor: pointer; background: transparent; }
    .gp-club-wrap { position: relative; width: 30px; height: 30px; }
    .gp-club-pulse { position: absolute; inset: -7px; border-radius: 50%; border: 2px solid rgba(212,175,55,0.85); opacity: 0; z-index: 0; transform: scale(0.6); animation: gpClubPulse 2.4s ease-out infinite; }
    .gp-club-pulse--late { border-color: rgba(212,175,55,0.55); animation-delay: 1.2s; }
    .gp-club-core { position: relative; z-index: 1; width: 30px; height: 30px; background-size: contain; background-repeat: no-repeat; animation: gpClubBreath 2.4s ease-in-out infinite; }
    @keyframes gpClubPulse { 0% { transform: scale(0.6); opacity: 0.95; } 70% { transform: scale(2); opacity: 0; } 100% { transform: scale(2); opacity: 0; } }
    @keyframes gpClubBreath { 0%,100% { filter: drop-shadow(0 0 0 rgba(212,175,55,0)); } 50% { filter: drop-shadow(0 0 7px rgba(212,175,55,0.95)); } }
    .gp-sp-wrap { position: relative; width: 30px; height: 30px; }
    .gp-sp-ring { position: absolute; inset: -6px; border-radius: 7px; border: 1.5px solid rgba(184,134,11,0.85); transform: rotate(45deg); z-index: 0; animation: gpSpSpin 7s linear infinite; box-shadow: 0 0 10px rgba(184,134,11,0.45); }
    .gp-sp-ring--wide { inset: -11px; border-color: rgba(212,175,55,0.45); border-radius: 9px; animation: gpSpSpin 7s linear infinite reverse; }
    .gp-sp-core { position: relative; z-index: 1; width: 30px; height: 30px; background-size: contain; background-repeat: no-repeat; animation: gpSpGlow 2.8s ease-in-out infinite; }
    @keyframes gpSpSpin { from { transform: rotate(45deg); } to { transform: rotate(405deg); } }
    @keyframes gpSpGlow { 0%,100% { filter: drop-shadow(0 0 0 rgba(212,175,55,0)); } 50% { filter: drop-shadow(0 0 8px rgba(212,175,55,0.9)); } }
    .gp-con-wrap { position: relative; width: 30px; height: 30px; }
    .gp-con-core { position: relative; z-index: 1; width: 30px; height: 30px; background-size: contain; background-repeat: no-repeat; animation: gpConPing 4s ease-in-out infinite; }
    @keyframes gpConPing { 0%,100% { filter: brightness(1) saturate(1); } 50% { filter: brightness(0.6) saturate(0.6) drop-shadow(0 0 4px rgba(255,255,255,0.7)); } }
    .gp-area-label { transform: translate(-50%, -50%); white-space: nowrap; font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #0b3d66; background: rgba(255,255,255,0.82); border: 1px solid rgba(11,61,102,0.4); border-radius: 999px; padding: 3px 12px; pointer-events: none; box-shadow: 0 2px 6px rgba(0,0,0,0.25); font-family: var(--font-body); }
    .gp-hotel-label { transform: translate(-50%, -100%); white-space: nowrap; font-size: 11px; font-weight: 700; color: #1f2937; background: rgba(255,255,255,0.9); border: 1px solid rgba(148,163,184,0.8); border-radius: 6px; padding: 2px 8px; pointer-events: none; box-shadow: 0 2px 6px rgba(0,0,0,0.25); font-family: var(--font-body); }

    .mapboxgl-popup-content { border-radius: 14px !important; padding: 12px 14px !important; box-shadow: 0 12px 30px rgba(0,0,0,0.45) !important; font-family: var(--font-body) !important; max-width: 260px; }
    .gp-dir { margin-top: 6px; padding: 6px 12px; border-radius: 8px; border: 1px solid rgba(212,175,55,0.8); background: linear-gradient(180deg,#faf4e3,#f1e4b8); color: #1f1f1f; font-size: 11px; font-weight: 700; cursor: pointer; width: 100%; text-align: center; }
    .gp-cart-btn { margin-top: 4px; padding: 6px 12px; border-radius: 8px; border: 1px solid #10b981; background: #ecfdf5; color: #065f46; font-size: 11px; font-weight: 700; cursor: pointer; width: 100%; text-align: center; }
    .gp-club-pop .mapboxgl-popup-content { background: linear-gradient(160deg,#0e3a63 0%,#0b2a4a 100%) !important; border: 2px solid rgba(212,175,55,0.9) !important; color: #fdf7e8 !important; overflow: hidden; position: relative; }
    .gp-club-pop .mapboxgl-popup-tip { border-top-color: #0b2a4a !important; }
    .gp-club-pop .mapboxgl-popup-close-button { color: #ffd873 !important; }
    .gp-club-popup-logo { width: 140px; height: 140px; object-fit: contain; filter: drop-shadow(0 0 14px rgba(255,216,115,0.4)); margin: 0 auto; display: block; }
    .gp-club-popup-name { margin: 0 0 2px; color: #fdf7e8; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; text-align: center; }
    .gp-club-popup-hours { margin: 0 0 6px; color: #ffd873; font-size: 11px; text-align: center; }
    .gp-club-popup-desc { margin: 2px 0 6px; color: rgba(255,255,255,0.85); font-size: 12px; line-height: 1.4; text-align: center; }
    .gp-sp-pop .mapboxgl-popup-content { background: linear-gradient(160deg,#212a36 0%,#141a22 100%) !important; border: 2px solid rgba(212,175,55,0.85) !important; color: #ffffff !important; }
    .gp-sp-pop .mapboxgl-popup-tip { border-top-color: #141a22 !important; }
    .gp-sp-pop .mapboxgl-popup-close-button { color: #f2d383 !important; }
    .gp-sp-popup-badge { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; border: 1px solid rgba(212,175,55,0.9); background: rgba(212,175,55,0.12); color: #f2d383; font-weight: 700; font-size: 10px; letter-spacing: 0.2em; margin-bottom: 6px; }
    .gp-sp-popup-name { font-family: var(--font-display); font-size: 16px; margin-bottom: 4px; color: #fff; }
    .gp-sp-popup-desc { font-size: 12px; color: rgba(255,255,255,0.8); line-height: 1.4; margin-bottom: 6px; }

    .guide-toggle { position: fixed; bottom: 24px; right: 24px; z-index: 200000; background: #caa867; color: #ffffff; border: none; border-radius: 999px; padding: 12px 22px; font-size: 13px; font-weight: 700; cursor: pointer; box-shadow: 0 6px 18px rgba(0,0,0,0.35); font-family: var(--font-body); }
    .guide-panel { position: fixed; top: 0; right: 0; width: 380px; max-width: 92vw; height: 100vh; background: #ffffff; z-index: 200001; display: flex; flex-direction: column; box-shadow: -4px 0 24px rgba(0,0,0,0.35); transform: translateX(100%); transition: transform 0.28s ease; font-family: var(--font-body); }
    .guide-panel.is-open { transform: translateX(0); }
    .guide-panel-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px; border-bottom: 1px solid #e2e8f0; background: #f8fafc; }
    .guide-panel-head h3 { font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: #8c734b; font-weight: 700; margin: 0; }
    .guide-panel-close { background: none; border: none; font-size: 24px; color: #94a3b8; cursor: pointer; }
    .guide-panel-body { padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; overflow: hidden; flex: 1; }
    .guide-search { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 999px; background: #f1f5f9; }
    .guide-search input { border: none; background: transparent; outline: none; flex: 1; font-size: 13px; }
    .guide-chips { display: flex; flex-wrap: wrap; gap: 6px; max-height: 90px; overflow: auto; }
    .guide-chip { border: 1px solid #cbd5e1; background: #f8fafc; color: #334155; border-radius: 999px; padding: 4px 10px; font-size: 11px; cursor: pointer; }
    .guide-chip.active { background: #caa867; color: #ffffff; border-color: #caa867; }
    .guide-list { flex: 1; overflow: auto; display: flex; flex-direction: column; gap: 4px; }
    .guide-item { display: flex; align-items: center; gap: 8px; width: 100%; border: 1px solid #e2e8f0; background: #ffffff; border-radius: 8px; padding: 8px 10px; cursor: pointer; text-align: left; }
    .guide-item:hover { background: #f1f5f9; }
    .guide-item.is-active { border-color: #caa867; background: #faf6ec; }
    .guide-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .guide-item-name { font-size: 13px; font-weight: 600; color: #1e293b; flex: 1; }
    .guide-item-cat { font-size: 10px; color: #64748b; text-transform: uppercase; }
  </style>
</head>
<body>

  <div class="demo-info-card">
    <h2>The Club Explorer - Playa Paraíso</h2>
    <p>Solo Iberostar Playa Paraíso visible. Resto tapado.</p>
    <p id="lblStatus" style="margin-top: 4px; font-weight: 600; color: #8c734b;">Cargando...</p>
  </div>

  <div id="map"></div>

  <button class="guide-toggle" id="guideToggle">Mostrar guía</button>

  <aside class="guide-panel" id="guidePanel">
    <div class="guide-panel-head">
      <h3>Guía interactiva · The Club</h3>
      <button class="guide-panel-close" id="guideClose">&times;</button>
    </div>
    <div class="guide-panel-body">
      <div class="guide-search">
        <span>🔍</span>
        <input type="search" id="guideSearch" placeholder="Buscar lugar..." />
      </div>
      <div class="guide-chips" id="guideChips"></div>
      <div class="guide-count" id="guideCount" style="font-size: 11px; color: #64748b;"></div>
      <div class="guide-list" id="guideList"></div>
    </div>
  </aside>

  <script>
    mapboxgl.accessToken = 'pk.eyJ1IjoiamVzbGV5IiwiYSI6ImNtdWJxZmh6bzAxZXcyeW9vYWo2Nm9tdTEifQ.JaXttmwjA77pT6SKkGH6nA';

    window.RevistaDigital = window.RevistaDigital || {};
    window.RevistaDigital.state = window.RevistaDigital.state || {};
    var gp = window.RevistaDigital.guiapa || (window.RevistaDigital.guiapa = {});
    if (window.RevistaDigital.datosComplejo) window.RevistaDigital.datosComplejo = window.RevistaDigital.datosComplejo;
    try { document.body.style.background = '#000000'; document.documentElement.style.background = '#000000'; } catch(e){}

    var complexRing = Array.isArray(gp.COMPLEX_RING) ? gp.COMPLEX_RING.slice() : [];
    function ringToLngLat(r){ return (r||[]).map(function(c){ return [c[1], c[0]]; }); }
    var contour = ringToLngLat(complexRing);

    var sw=null, ne=null;
    if(contour.length>0){
      var lngsArr = contour.map(function(p){return p[0];});
      var latsArr = contour.map(function(p){return p[1];});
      sw=[Math.min.apply(null,lngsArr), Math.min.apply(null,latsArr)];
      ne=[Math.max.apply(null,lngsArr), Math.max.apply(null,latsArr)];
    }
    var BOUNDS = (sw&&ne)?[[sw[0],sw[1]],[ne[0],ne[1]]]:[[-86.9740,20.7500],[-86.9560,20.7680]];

    var map = new mapboxgl.Map({
      container: 'map',
      style: 'mapbox://styles/mapbox/standard',
      center: [-86.96645, 20.75805],
      zoom: 16.25,
      minZoom: 15.7,
      maxZoom: 19.5,
      pitch: 65,
      bearing: -45,
      maxBounds: BOUNDS,
      maxBoundsViscosity: 1.0,
      antialias: true
    });

    map.addControl(new mapboxgl.NavigationControl({ visualizePitch: true }), 'top-right');

    function applyNightAndClean(){
      try { map.setTerrain(null); } catch(e){}
      try { map.setFog(null); } catch(e){}
      try { map.setPaintProperty('background', 'background-color', '#000000'); } catch(e){}
      try { map.setConfigProperty('basemap', 'lightPreset', 'night'); } catch(e){}

      var style = map.getStyle();
      if(style && Array.isArray(style.layers)){
        for(var i = style.layers.length - 1; i >= 0; i--){
          var layer = style.layers[i];
          if(!layer || !layer.id) continue;
          var id = layer.id;
          var lid = id.toLowerCase();
          if(id === 'pp-mask' || id === 'pp-buildings-3d') continue;
          if(layer.type === 'fill-extrusion') {
            try { map.removeLayer(id); } catch(e){}
            continue;
          }
          if(lid.indexOf('building') >= 0) {
            try { map.removeLayer(id); } catch(e){}
            continue;
          }
          if(lid.indexOf('road') >= 0 || lid.indexOf('bridge') >= 0 || lid.indexOf('tunnel') >= 0 || lid.indexOf('path') >= 0 || lid.indexOf('rail') >= 0 || lid.indexOf('transit') >= 0 || lid.indexOf('ferry') >= 0 || lid.indexOf('aeroway') >= 0 || lid.indexOf('label') >= 0 || lid.indexOf('poi') >= 0 || lid.indexOf('place') >= 0 || lid.indexOf('admin') >= 0 || lid.indexOf('country') >= 0 || lid.indexOf('state') >= 0 || lid.indexOf('settlement') >= 0 || lid.indexOf('neighbour') >= 0 || lid.indexOf('waterway') >= 0 || lid.indexOf('landuse') >= 0 || lid.indexOf('park') >= 0 || lid.indexOf('natural') >= 0 || lid.indexOf('landcover') >= 0 || lid.indexOf('hillshade') >= 0) {
            try { map.removeLayer(id); } catch(e){}
            continue;
          }
        }
      }
    }

    function showOnlyComplex(){
      if(contour.length < 3) return;
      var world = [[-180,-90],[180,-90],[180,90],[-180,90],[-180,-90]];

      if(!map.getSource('pp-mask-src')){
        try {
          map.addSource('pp-mask-src', {
            type: 'geojson',
            data: { type: 'Feature', geometry: { type: 'Polygon', coordinates: [world, contour] } }
          });
        } catch(e){}
      } else {
        try { map.getSource('pp-mask-src').setData({ type: 'Feature', geometry: { type: 'Polygon', coordinates: [world, contour] } }); } catch(e){}
      }

      if(!map.getLayer('pp-mask')){
        try {
          map.addLayer({
            id: 'pp-mask',
            type: 'fill',
            source: 'pp-mask-src',
            paint: { 'fill-color': '#000000', 'fill-opacity': 1.0 }
          });
        } catch(e){}
      }
      try { if(map.getLayer('pp-mask')) map.moveLayer('pp-mask'); } catch(e){}

      if(!map.getLayer('pp-buildings-3d')){
        try {
          map.addLayer({
            id: 'pp-buildings-3d',
            type: 'fill-extrusion',
            source: 'composite',
            'source-layer': 'building',
            filter: ['all', ['==', ['get', 'extrude'], 'true']],
            minzoom: 13,
            paint: {
              'fill-extrusion-color': '#bfbfbf',
              'fill-extrusion-height': ['get', 'height'],
              'fill-extrusion-base': ['get', 'min_height'],
              'fill-extrusion-opacity': 1.0
            }
          });
        } catch(e){}
      }
      try { if(map.getLayer('pp-buildings-3d')) map.moveLayer('pp-buildings-3d', 'pp-mask'); } catch(e){}
    }

    map.on('style.load', function(){
      map.setMaxBounds(BOUNDS);
      map.setMaxBoundsViscosity(1.0);
      applyNightAndClean();
      showOnlyComplex();
    });

    map.on('load', function(){
      applyNightAndClean();
      showOnlyComplex();
      setTimeout(function(){ try{ applyNightAndClean(); showOnlyComplex(); }catch(e){} }, 200);
      setTimeout(function(){ try{ applyNightAndClean(); showOnlyComplex(); }catch(e){} }, 800);
    });

      map.on('idle', function(){
      applyNightAndClean();
      showOnlyComplex();
      try { if(map.getLayer('pp-mask')) map.moveLayer('pp-mask'); } catch(e){}
      try { if(window.renderPPMarkers) window.renderPPMarkers(); renderMarkers(); try { renderChips(); renderList(); } catch(e){} } catch(e){}
    });

    window.addEventListener('resize', function(){ map.resize(); });
    window.irAlPunto = function(nombre, lat, lng){
      try { sessionStorage.setItem('destino_solicitado', JSON.stringify({nombre:nombre, lat:lat, lng:lng})); } catch(e){}
      window.location.href = 'carrito-golf.html';
    };
  </script>

  <script>
    (function(){
      var gpApi = (window.RevistaDigital && window.RevistaDigital.guiapa) || {};
      var POIS = Array.isArray(gpApi.POIS) ? gpApi.POIS.slice() : [];
      if(!POIS.length && Array.isArray(window.POIS)) POIS = window.POIS.slice();
      if(!POIS.length && window.RevistaDigital){
        if(Array.isArray(window.RevistaDigital.POIS)) POIS = window.RevistaDigital.POIS.slice();
      }
      var CATEGORIES = gpApi.CATEGORIES || (window.CATEGORIES || (gpApi && gpApi.CATEGORIAS) || {});
      var markers = {};
      var state = { selectedId: null, category: '', query: '' };

      function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
      function catColor(cat){ var c = CATEGORIES[cat]; return (c && c.color) ? c.color : '#808080'; }

      function getMarkerHTML(p,color){
        var size = 30;
        var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="'+size+'" height="'+size+'" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="'+color+'" stroke="#fff" stroke-width="2"/><circle cx="12" cy="12" r="4" fill="#fff"/></svg>';
        var coreStyle = 'background-image:url(data:image/svg+xml;base64,'+btoa(svg)+');';
        if(p.category === 'club') return '<div class="gp-club-wrap"><span class="gp-club-pulse"></span><span class="gp-club-pulse gp-club-pulse--late"></span><div class="gp-club-core" style="'+coreStyle+'"></div></div>';
        if(p.category === 'starprestige') return '<div class="gp-sp-wrap"><span class="gp-sp-ring"></span><span class="gp-sp-ring gp-sp-ring--wide"></span><div class="gp-sp-core" style="'+coreStyle+'"></div></div>';
        if(p.category === 'concierge') return '<div class="gp-con-wrap"><div class="gp-con-core" style="'+coreStyle+'"></div></div>';
        return '<div style="'+coreStyle+' width:'+size+'px; height:'+size+'px; background-size:contain;"></div>';
      }

      function getPopupHTML(p){
        var name = esc(p.name || 'Lugar');
        var hours = esc(p.hours || p.horario || '08:00 - 22:00');
        var desc = p.description ? esc(p.description) : '';
        var dirBtn = '<button class="gp-dir" onclick="irAlPunto(\''+esc(p.name||'').replace(/'/g,"\\'")+'\','+p.lat+','+p.lng+')">Cómo llegar</button>';
        var isCartEligible = p.category === 'restaurante' || p.category === 'golf';
        var cartBtn = isCartEligible ? '<button class="gp-cart-btn" onclick="irAlPunto(\''+esc(p.name||'').replace(/'/g,"\\'")+'\','+p.lat+','+p.lng+')">Solicitar carrito</button>' : '';
        if(p.category === 'club') return '<div class="gp-club-popup"><div class="gp-club-popup-badge"><img class="gp-club-popup-logo" src="branding/IB_THE_CLUB_VV_POS_RGB-320.webp" alt="The Club" /></div><h3 class="gp-club-popup-name">'+name+'</h3><p class="gp-club-popup-hours">'+hours+'</p>'+(desc?'<p class="gp-club-popup-desc">'+desc+'</p>':'')+dirBtn+'</div>';
        if(p.category === 'starprestige') return '<div class="gp-sp-popup"><div class="gp-sp-popup-badge"><span class="gp-sp-popup-star">✦</span>STAR PRESTIGE</div><h3 class="gp-sp-popup-name">'+name+'</h3>'+(desc?'<p class="gp-sp-popup-desc">'+desc+'</p>':'')+'<p class="gp-sp-popup-hours">'+hours+'</p>'+dirBtn+'</div>';
        return '<div><strong style="font-size:14px;color:#0f172a;">'+name+'</strong>'+(desc?'<p style="font-size:11px;color:#475569;margin:4px 0;">'+desc+'</p>':'')+'<small style="color:#64748b;display:block;margin-bottom:6px;">'+hours+'</small>'+dirBtn+cartBtn+'</div>';
      }

      var markersRendered = false;
      function renderMarkers(){
        var listPOIS = [];
        try {
          var g = (window.RevistaDigital && window.RevistaDigital.guiapa) || {};
          if(Array.isArray(g.POIS) && g.POIS.length) listPOIS = g.POIS.slice();
        } catch(e){}
        if(!listPOIS.length && Array.isArray(POIS) && POIS.length) listPOIS = POIS.slice();
        if(!listPOIS.length && Array.isArray(window.POIS)) listPOIS = window.POIS.slice();
        if(!listPOIS.length && window.RevistaDigital && Array.isArray(window.RevistaDigital.POIS)) listPOIS = window.RevistaDigital.POIS.slice();
        var count = 0;
        (listPOIS || []).forEach(function(p){
          if(!p) return;
          if(p.lat == null || p.lng == null || p.external === true) return;
          if(markers[p.id]) return;
          if(p.kind === 'area'){ var lblEl = document.createElement('div'); lblEl.className = 'gp-area-label'; lblEl.textContent = p.name || ''; var ma = new mapboxgl.Marker({element: lblEl, anchor: 'center'}).setLngLat([parseFloat(p.lng), parseFloat(p.lat)]).addTo(map); markers[p.id] = ma; count++; return; }
          if(p.category === 'hotel'){ var hEl = document.createElement('div'); hEl.className = 'gp-hotel-label'; hEl.textContent = p.name || ''; var mh = new mapboxgl.Marker({element: hEl, anchor: 'bottom'}).setLngLat([parseFloat(p.lng), parseFloat(p.lat)]).addTo(map); markers[p.id] = mh; count++; return; }
          var color = p.color || catColor(p.category);
          var container = document.createElement('div'); container.className = 'gp-marker-container'; container.innerHTML = getMarkerHTML(p, color);
          var popupCls = p.category === 'club' ? 'gp-club-pop' : (p.category === 'starprestige' ? 'gp-sp-pop' : '');
          var popup = new mapboxgl.Popup({offset: 14, closeButton: true, focusAfterOpen: false, className: popupCls}).setHTML(getPopupHTML(p));
          var marker = new mapboxgl.Marker({element: container, anchor: 'center'}).setLngLat([parseFloat(p.lng), parseFloat(p.lat)]).setPopup(popup).addTo(map);
          markers[p.id] = marker;
          container.addEventListener('click', function(){ selectPoi(p.id); });
          count++;
        });
        if(Object.keys(markers).length > 0) markersRendered = true;
        var lblStatus = document.getElementById('lblStatus');
        if(lblStatus) lblStatus.textContent = Object.keys(markers).length + ' POIs';
      }
      window.renderPPMarkers = function(){ try { renderMarkers(); } catch(e){} };

      function selectPoi(id){
        var p = POIS.find(function(x){ return x.id === id; });
        if(!p || p.lat == null || p.lng == null) return;
        state.selectedId = id;
        map.flyTo({ center: [parseFloat(p.lng), parseFloat(p.lat)], zoom: 17.2, pitch: 65, bearing: -45, duration: 900 });
        var m = markers[id];
        if(m && m.getPopup && !m.getPopup().isOpen()){ try{ m.togglePopup(); }catch(e){} }
        renderList();
      }

      var guidePanel = document.getElementById('guidePanel');
      var guideToggle = document.getElementById('guideToggle');
      var guideClose = document.getElementById('guideClose');
      var guideSearch = document.getElementById('guideSearch');
      var guideChips = document.getElementById('guideChips');
      var guideList = document.getElementById('guideList');
      var guideCount = document.getElementById('guideCount');

      function renderList(){
        var sourceList = [];
        try {
          var g = (window.RevistaDigital && window.RevistaDigital.guiapa) || {};
          if(Array.isArray(g.POIS)) sourceList = g.POIS;
        } catch(e){}
        if(!sourceList.length && Array.isArray(POIS)) sourceList = POIS;
        if(!sourceList.length && Array.isArray(window.POIS)) sourceList = window.POIS;
        var q = state.query.trim().toLowerCase();
        var list = (sourceList || []).filter(function(p){
          if(!p) return false;
          if(p.lat == null || p.lng == null || p.external === true) return false;
          if(p.kind === 'area' || p.category === 'hotel') return true;
          if(state.category && p.category !== state.category) return false;
          if(q){ var haystack = [p.name, p.description, p.category, p.hotelId].filter(Boolean).join(' ').toLowerCase(); if(haystack.indexOf(q) === -1) return false; }
          return true;
        });
        var total = (sourceList || []).filter(function(p){ return p && p.lat != null && p.lng != null && p.external !== true; }).length;
        if(guideCount) guideCount.textContent = list.length + ' de ' + total + ' lugares';
        if(!list.length){ guideList.innerHTML = '<div style="font-size:12px;color:#64748b;padding:12px;">No se encontraron lugares.</div>'; return; }
        guideList.innerHTML = list.map(function(p){
          var c = p.kind === 'area' ? '#0b3d66' : (p.category === 'hotel' ? '#8c734b' : catColor(p.category));
          var active = state.selectedId === p.id ? ' is-active' : '';
          return '<button class="guide-item'+active+'" data-id="'+esc(p.id)+'"><span class="guide-dot" style="background:'+c+'"></span><span class="guide-item-name">'+esc(p.name)+'</span><span class="guide-item-cat">'+esc(p.kind==='area'?'área':(p.category==='hotel'?'hotel':p.category))+'</span></button>';
        }).join('');
        guideList.querySelectorAll('.guide-item').forEach(function(btn){ btn.addEventListener('click', function(){ selectPoi(btn.getAttribute('data-id')); }); });
      }

      function renderChips(){
        var cats = [];
        try {
          var g = (window.RevistaDigital && window.RevistaDigital.guiapa) || {};
          cats = Object.keys(g.CATEGORIES || CATEGORIES || {});
        } catch(e){
          cats = Object.keys(CATEGORIES || {});
        }
        if(!guideChips) return;
        guideChips.innerHTML = '<button class="guide-chip active" data-cat="">Todas</button>' + cats.map(function(c){ var cl = (CATEGORIES[c] && CATEGORIES[c].label) || (window.RevistaDigital && window.RevistaDigital.guiapa && window.RevistaDigital.guiapa.CATEGORIES && window.RevistaDigital.guiapa.CATEGORIES[c] && window.RevistaDigital.guiapa.CATEGORIES[c].label) || c; return '<button class="guide-chip" data-cat="'+esc(c)+'">'+esc(cl)+'</button>'; }).join('');
        guideChips.querySelectorAll('.guide-chip').forEach(function(btn){
          btn.addEventListener('click', function(){
            state.category = btn.getAttribute('data-cat') || '';
            guideChips.querySelectorAll('.guide-chip').forEach(function(b){ b.classList.toggle('active', b === btn); });
            renderList();
          });
        });
      }

      if(guideToggle) guideToggle.addEventListener('click', function(){ guidePanel.classList.toggle('is-open'); guideToggle.textContent = guidePanel.classList.contains('is-open') ? 'Ocultar guía' : 'Mostrar guía'; });
      if(guideClose) guideClose.addEventListener('click', function(){ guidePanel.classList.remove('is-open'); if(guideToggle) guideToggle.textContent = 'Mostrar guía'; });
      if(guideSearch) guideSearch.addEventListener('input', function(){ state.query = guideSearch.value; renderList(); });

      function init(){ try { applyNightAndClean(); showOnlyComplex(); if(window.renderPPMarkers) window.renderPPMarkers(); renderMarkers(); try { renderChips(); renderList(); } catch(e){} } catch(e){} }
      map.on('load', function(){ setTimeout(init, 200); setTimeout(init, 600); setTimeout(init, 1200); setTimeout(init, 2500); setTimeout(init, 4000); });
      setInterval(function(){ try { if(window.renderPPMarkers) window.renderPPMarkers(); renderMarkers(); try { renderChips(); renderList(); } catch(e){} } catch(e){} }, 400);
    })();
  </script>
</body>
</html>
