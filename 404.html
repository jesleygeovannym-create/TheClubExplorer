<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Club Explorer</title>
  <script>
    (function () {
      const isGitHubPages = window.location.hostname.endsWith("github.io");
      // El sitio vive en un subdirectorio del repositorio; se deduce el primer
      // segmento de la ruta para no depender del nombre del repositorio.
      const segments = window.location.pathname.split("/").filter(Boolean);
      const projectBase = isGitHubPages && segments.length ? `/${segments[0]}/` : "/";
      const projectPrefix = projectBase.replace(/\/$/, "");
      let routePath = window.location.pathname;

      if (projectPrefix && routePath.startsWith(`${projectPrefix}/`)) {
        routePath = routePath.slice(projectPrefix.length);
      }

      const target = new URL(projectBase, window.location.origin);
      target.searchParams.set("route-entry", routePath || "/");
      window.location.replace(target.href);
    })();
  </script>
</head>
<body></body>
</html>
